<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Card Game</title>
  <style>
    /* --- Google Fonts: Poppins --- */
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap");

    /* --- Variable CSS --- */
    :root {
      --bgColor: #6563ff;
      --bgWrapper: #f8f8f8;
    }

    /* --- Reset --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bgColor);
    }
    ::selection {
      color: #fff;
      background-color: var(--bgColor);
    }
    
    /* Home Button Style */
    .header-bar {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        padding: 0 20px;
    }
    .btn-home {
        background-color: #fff;
        color: var(--bgColor);
        border: 2px solid #fff;
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: all 0.3s;
        cursor: pointer;
    }
    .btn-home:hover {
        background-color: transparent;
        color: #fff;
    }

    p {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .wrapper {
      background-color: var(--bgWrapper);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .cards,
    .card,
    .view,
    .details {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cards {
      height: 600px;
      width: 600px;
      flex-wrap: wrap;
      justify-content: space-between;
      list-style: none;
    }
    .cards .card {
      cursor: pointer;
      position: relative;
      perspective: 1000px;
      transform-style: preserve-3d;
      height: calc(100% / 4 - 10px);
      width: calc(100% / 4 - 10px);
    }
    .cards .card .view {
      width: 100%;
      height: 100%;
      user-select: none;
      pointer-events: none;
      position: absolute;
      background: #fff;
      border-radius: 7px;
      backface-visibility: hidden;
      transition: transform 0.25s linear;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .card .front-view img {
      max-width: 17px;
    }
    .card .back-view img {
      max-width: 120px;
    }

    .card .back-view {
      transform: rotateY(-180deg);
    }

    .card.flip .front-view {
      transform: rotateY(180deg);
    }
    .card.flip .back-view {
      transform: rotateY(0);
    }

    /* --- Animation --- */
    .card.shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-13px); }
      40% { transform: translateX(13px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    /* --- Details --- */
    .details {
      width: 100%;
      margin-top: 15px;
      padding: 0 20px;
      border-radius: 7px;
      background: #fff;
      height: calc(100% / 4 - 10px);
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    .details p {
      font-size: 18px;
      height: 17px;
      padding-right: 18px;
      border-right: 1px solid #ccc;
    }
    .details p span {
      margin-left: 8px;
    }
    .details p b {
      font-weight: 500;
    }
    .details button {
      cursor: pointer;
      font-size: 14px;
      color: var(--bgColor);
      border-radius: 4px;
      padding: 4px 11px;
      background-color: #fff;
      border: 2px solid var(--bgColor);
      transition: all 0.3s ease;
    }
    .details button:hover {
      color: #fff;
      background-color: var(--bgColor);
    }

    #msg-area {
        margin-top: 15px;
        text-align: center;
        color: #fff;
        font-weight: bold;
        font-size: 18px;
        min-height: 27px;
    }

    /* --- Media Queries --- */
    @media screen and (max-width: 700px) {
      .cards { height: 350px; width: 350px; }
      .card .front-view img { max-width: 16px; }
      .card .back-view img { max-width: 40px; }
    }

    @media screen and (max-width: 430px) {
      .cards { height: 300px; width: 300px; }
      .card .back-view img { max-width: 35px; }
      .details { margin-top: 10px; padding: 0 15px; height: calc(100% / 4 - 20px); }
      .details p { height: 15px; font-size: 17px; padding-right: 13px; }
      .details button { font-size: 13px; padding: 5px 10px; border: none; background-color: #fff; border: 2px solid var(--bgColor); }
    }

    @media screen and (max-width: 325px) {
      .cards { height: 250px; width: 250px; }
      .card .back-view img { max-width: 30px; }
      .details { margin-top: 10px; padding: 0 15px; height: calc(100% / 4 - 20px); }
      .details p { height: 13px; font-size: 15px; padding-right: 13px; }
      .details button { font-size: 13px; padding: 2px 4px; border: none; background-color: #fff; border: 2px solid var(--bgColor); margin-left: 5px; }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div style="flex:1"></div>
    <button class="btn-home" onclick="goHome()">🏠 홈으로</button>
  </div>

  <div class="wrapper">
    <ul class="cards">
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-1.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-2.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-3.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-4.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-5.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-6.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-1.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-2.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-3.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-4.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-5.png" alt="card-image" /></div>
      </li>
      <li class="card">
        <div class="view front-view"><img src="./assets/images/que_icon.svg" alt="question-icon" /></div>
        <div class="view back-view"><img src="./assets/images/img-6.png" alt="card-image" /></div>
      </li>

      <div class="details">
        <p class="time">시간: <span><b>60</b>초</span></p>
        <p class="flips">시도 횟수: <span><b>0</b></span></p>
        <button onclick="shuffleCard()">다시 시작</button>
      </div>
    </ul>
  </div>

  <div id="msg-area"></div>

  <script>
    "use strict";

    // Selecting Elements
    const cards = document.querySelectorAll(".card");
    const timeTag = document.querySelector(".time b");
    const flipsTag = document.querySelector(".flips b");
    const restartBtn = document.querySelector(".details button");
    const msgArea = document.getElementById("msg-area");

    // Required Variables
    let maxTime = 60;
    let timeLeft = maxTime;
    let flips = 0;
    let matchedCard = 0;
    let disableDeck = false;
    let isPlaying = false;
    let card1, card2, timer;

    function goHome() {
      if(isPlaying) endGame(false);
      window.location.href = 'index.html';
    }

    function sendScore(gameType, score, errors) {
      if (window.btcSaveTraining) { var _lbl = '점수 ' + score + '점' + ((typeof errors !== 'undefined' && errors !== null && errors !== '') ? ' · 실수 ' + errors + '회' : ''); window.btcSaveTraining(window.btcGameName(gameType), _lbl); }
    }

    function endGame(isWin) {
      clearInterval(timer);
      isPlaying = false;
      let finalScore = isWin ? timeLeft * 10 : 0;
      let errors = Math.max(0, Math.floor(flips / 2) - matchedCard);
      
      if(isWin) {
          msgArea.textContent = `성공! 멋지네요 🎉 점수: ${finalScore}`;
      } else {
          msgArea.textContent = `시간 초과! ⏳ 다음엔 더 잘할 수 있어요.`;
      }
      sendScore(5, finalScore, errors); // 5 = Memory Card Game
    }

    // Function initial Timer
    function initialTimer() {
      if (timeLeft <= 0) {
        endGame(false);
        return clearInterval(timer);
      }
      timeLeft--;
      timeTag.innerText = timeLeft;
    }

    // Function FlipCard
    function flipCard({ target: clickedCard }) {
      // Find the parent .card li if the clicked element is a view inside it
      let cardElement = clickedCard.closest('.card');
      if (!cardElement) return;

      if (!isPlaying) {
        isPlaying = true;
        timer = setInterval(initialTimer, 1000);
      }
      if (cardElement !== card1 && !disableDeck && timeLeft > 0 && !cardElement.classList.contains('flip')) {
        flips++;
        flipsTag.innerText = flips;
        cardElement.classList.add("flip");
        if (!card1) {
          return (card1 = cardElement);
        }
        card2 = cardElement;
        disableDeck = true;
        let card1Img = card1.querySelector(".back-view img").src,
          card2Img = card2.querySelector(".back-view img").src;
        matchCard(card1Img, card2Img);
      }
    }

    // Function MatchCard
    function matchCard(img1, img2) {
      if (img1 === img2) {
        matchedCard++;
        if (matchedCard == 6 && timeLeft > 0) {
          setTimeout(() => {
              endGame(true);
          }, 500);
          return clearInterval(timer);
        }
        card1.removeEventListener("click", flipCard);
        card2.removeEventListener("click", flipCard);
        card1 = card2 = "";
        return (disableDeck = false);
      }

      setTimeout(() => {
        card1.classList.add("shake");
        card2.classList.add("shake");
      }, 400);

      setTimeout(() => {
        card1.classList.remove("shake", "flip");
        card2.classList.remove("shake", "flip");
        card1 = card2 = "";
        disableDeck = false;
      }, 1200);
    }

    // Function ShuffleCard
    function shuffleCard() {
      timeLeft = maxTime;
      flips = matchedCard = 0;
      card1 = card2 = "";
      clearInterval(timer);
      timeTag.innerText = timeLeft;
      flipsTag.innerText = flips;
      msgArea.textContent = "";
      disableDeck = isPlaying = false;

      let arr = [1, 2, 3, 4, 5, 6, 1, 2, 3, 4, 5, 6];
      arr.sort(() => (Math.random() > 0.5 ? 1 : -1));

      cards.forEach((card, i) => {
        card.classList.remove("flip", "shake");
        let imgTag = card.querySelector(".back-view img");

        setTimeout(() => {
          imgTag.src = `./assets/images/img-${arr[i]}.png`;
        }, 500);
        
        // Remove old listeners to avoid duplicates if shuffleCard is called multiple times
        card.removeEventListener("click", flipCard);
        // Add listener back
        card.addEventListener("click", flipCard);
      });
    }

    shuffleCard();

    // Add events
    restartBtn.addEventListener("click", shuffleCard);

    cards.forEach((card) => {
      card.addEventListener("click", flipCard);
    });
  </script>
  <script src="./btc-bridge.js"></script>
</body>
</html>
